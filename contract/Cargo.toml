[package]
name = "patron-escrow"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"
near-contract-standards = "5.30.0"
serde_json = "1"

[dev-dependencies]
anyhow = "1.0"
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
near-workspaces = { version = "0.24.0", features = ["unstable"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
